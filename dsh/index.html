<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="ddesigner.css">
</head>
<body>
        <h1>🎈Dashboard🎈</h1>

        <input type="text" id="name" placeholder="name">

        <h1 id="ausgabe">
            Hallo!👋😀
        </h1>

        <div class="box">
            <h1>randomvalue: <strong id="zufall">-</strong></h1>
        </div>

        <div>
            <h2 id="spruchText">
                👇 Wähle ein Spruch
            </h2>

            <button id="button">Neuer Spruch</button>
        </div>

        <div class="box">
            <h1 id="zaehler">Zähler🔢</h1>
            <p>Zählerstand: <strong id="zaehlerAnzeige">0</strong></p>
            <button id="erhoehenbutton">+</button>
            <button id="verringernbutton">-</button>
        </div>


        <h1>designwechsel🌅</h1>

        <label>
            <select id="dropdown">
                <option value="standard">🌼 Standard</option>
                <option value="sunset">🌇 Sunset</option>
                <option value="nature">🌿 Nature</option>
            </select>
        </label>

        <script src="xdxd.js"></script>
</body>
</html>
